name: CGV IMAX Open Alert

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cgv_imax_alert.py --once

      - name: Commit state
        run: |
          git config user.name "imax-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imax_state.json
          git diff --cached --quiet || git commit -m "update state" && git push
