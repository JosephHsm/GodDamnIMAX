# .github/workflows/imax-alert.yml 경로에 넣으면 됨
name: CGV IMAX Open Alert

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (Actions 특성상 몇 분 지연될 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # 상태 파일 커밋용

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cgv_imax_alert.py --once

      - name: Commit state
        run: |
          git config user.name "imax-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imax_state.json
          git diff --cached --quiet || git commit -m "update state" && git push
